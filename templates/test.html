<html>


<body>
<h3>STUDENT REGISTRATION FORM</h3>
<form>
    <fieldset style="width:400px; height:400px; text-align:center;">
        <legend style="text-align:right;">شخص</legend>
    <table align="center" cellpadding = "6">
        <tr>
            <td>FIRST NAME</td>
            <td><input type="text" name="First_Name"/>
            </td>
        </tr>
    </table>
    </fieldset>
    <fieldset>
        <legend>شخص</legend>
        <table align="center" cellpadding = "6">
            <tr>
            <td>MOBILE NUMBER</td>
            <td>
                <input type="text" name="Mobile_Number" maxlength="10" />
            </td>
        </tr>
        <tr>
            <td>GENDER</td>
            <td>Male <input type="radio" name="Gender" value="Male" />
                Female <input type="radio" name="Gender" value="Female" />
                Transgender <input type="radio" name="Gender" value="Transgender" />
            </td>
        </tr>
        <tr>
            <td>COUNTRY</td>
            <td><input type="text" name="Country" value="India" readonly="readonly" /></td>
        </tr>
                    <tr>
            <td colspan="4" align="center">
                <input type="submit" value="Submit">
                <input type="reset" value="Reset">
            </td>
        </tr>
                </table>
    </fieldset>
    <fieldset>
        <legend>شخص</legend>
        <table align="center" cellpadding = "6">
        <tr>
            <td>HOBBIES <br /><br /><br /></td>
            <td>Writing<input type="checkbox" name="Hobby_1" value="Writing" />
                Sketching
                <input type="checkbox" name="Hobby_2" value="Designing" />
                Designing<input type="checkbox" name="Hobby_3" value="Cooking" />
                <br />
                Others
                <input type="checkbox" name="Hobby_4" value="Other">
                <input type="text" name="Other_Hobby" maxlength="30" />
            </td>
        </tr>
        <tr>
            <td>Percentage</td>
            <td><input type="text" name="percentage"/ maxlength="2" placeholder="marks in %"></td>
        </tr>
        <tr>
            <td colspan="4" align="center">
                <input type="submit" value="Submit">
                <input type="reset" value="Reset">
            </td>
        </tr>
    </table>
        </fieldset>
</form>
</body>
</html>
